name: Pilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/camera-transform.test.mjs
      - run: node --test tests/camera-lifecycle.test.mjs
      - run: npm run build
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r apps/api/requirements-product.txt pyyaml==6.0.3
      - run: python -m unittest discover -s ai/tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: apps/api
# GPU inference, physical cameras, Colab and LAN TLS are explicit manual release gates.
