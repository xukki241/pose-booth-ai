# Nginx Configuration for Pose-Booth AI
# SPA routing + API proxy + HTTPS ready
# Deploy: copy to /etc/nginx/sites-available/pose-booth and symlink to sites-enabled

upstream pose_booth_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (uncomment when SSL ready)
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment for HTTPS
    server_name localhost;   # Replace with yourdomain.com

    # SSL certificates (uncomment for HTTPS)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers for MediaPipe WASM (SharedArrayBuffer requirement)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ─────────────────────────────────────────
    # Frontend SPA (Next.js static export)
    # ─────────────────────────────────────────
    root /var/www/pose-booth/web;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─────────────────────────────────────────
    # SPA fallback — ALL unknown routes → index.html
    # This allows React Router to handle client-side routing
    # Matches: /booth, /pose-studio, /about, /gallery, etc.
    # ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────
    # API Proxy → FastAPI backend (port 8000)
    # ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://pose_booth_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Upload limit for base64 images (max 15MB)
        client_max_body_size 15m;
    }

    # FastAPI OpenAPI docs (dev only — remove in production)
    location /docs {
        proxy_pass http://pose_booth_api/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://pose_booth_api/openapi.json;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://pose_booth_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─────────────────────────────────────────
    # Future sub-apps (expand here)
    # ─────────────────────────────────────────
    # location /gallery/ {
    #     alias /var/www/pose-booth/gallery/;
    #     try_files $uri $uri/ /gallery/index.html;
    # }

    # Error pages
    error_page 404 /index.html;  # SPA handles 404
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
