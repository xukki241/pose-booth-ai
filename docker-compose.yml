version: "3.9"

services:
  # ─────────────────────────────────────
  # Frontend: Next.js SPA
  # ─────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pose-booth-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # ─────────────────────────────────────
  # Backend: FastAPI + YOLOv8
  # ─────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pose-booth-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=yolov8s-pose.pt
      - DEVICE=cpu             # Change to cuda for GPU
      - CORS_ORIGINS=http://localhost:3000,http://web:3000
    volumes:
      - ./ai/models/weights:/app/weights  # Mount trained models
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pose-booth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pose-booth.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
